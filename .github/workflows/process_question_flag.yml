name: AI Question Patcher (Flag to PR)

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to re-patch"
        required: false
      comments:
        description: "Review feedback / instructions for AI agent"
        required: false

# Prevent duplicate concurrent workflow runs while letting active run finish safely
concurrency:
  group: question-flag-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process_flag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && ((github.event.action == 'labeled' && github.event.label.name == 'question-flag') || (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'question-flag')))) ||
      (github.event_name == 'issue_comment' && !endsWith(github.event.comment.user.login, '[bot]') && (contains(github.event.comment.body, '/patch') || contains(github.event.comment.body, '/fix') || contains(github.event.comment.body, '/repatch') || (github.event.issue.pull_request && startsWith(github.event.issue.title, 'Fix question')))) ||
      (github.event_name == 'pull_request_review' && !endsWith(github.event.review.user.login, '[bot]') && startsWith(github.event.pull_request.title, 'Fix question'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Question Patcher Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 scripts/process_question_flag.py --event-path "$GITHUB_EVENT_PATH"
